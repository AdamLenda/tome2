name: Docs
on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  help-markdown:
    runs-on: ubuntu-22.04

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: regenerate doc/help
        run: python3 scripts/help_to_markdown.py

      - name: check doc/help
        run: python3 scripts/help_to_markdown.py --check

      - name: doc/help must match the help files
        run: |
          git diff --exit-code -- doc/help
          untracked=$(git ls-files --others --exclude-standard -- doc/help)
          if [ -n "$untracked" ]; then
            echo "Not committed:"
            echo "$untracked"
            exit 1
          fi
